[tool.pytest.ini_options]
# Put the project root on sys.path so `pytest` (not just `python -m pytest`)
# can import the `app` package. Without this the test suite fails to collect.
pythonpath = ["."]
testpaths = ["tests"]
# strict-markers turns a typo'd @pytest.mark.asyncio into an error rather than
# a silently-ignored decorator — which for async tests means the body never
# runs and the test passes without asserting anything.
# strict-config does the same for a mistyped setting in this file.
addopts = "--strict-markers --strict-config"
# A DeprecationWarning from our own code is a scheduled breakage: it means a
# future version of a dependency stops doing what this code asks. Printed at
# the end of a green run it reads as noise and gets scrolled past; as a
# failure it gets fixed while the fix is still cheap.
#
# The one exemption is Starlette telling FastAPI's TestClient that httpx is
# deprecated. That is upstream's business, not reachable from anything here,
# and it fires at import — matched on message rather than category so the
# exemption stays this specific warning and not everything Starlette emits.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-generated migration files follow Alembic's own boilerplate style,
# not ours — don't hand-tune them just to satisfy the linter every time.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# B (flake8-bugbear) catches the likely-a-bug shapes the others don't — it's
# how the over-broad `pytest.raises(Exception)` assertions were found, which
# would have passed on any error at all including a typo.
#
# S (flake8-bandit) is the security ruleset. Warranted here more than in most
# projects: this service holds provider credentials and spends real money, so
# the shapes it flags — a hardcoded secret, a shell=True, a bare `except` on a
# crypto path — are the ones that cost something.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults, which is exactly how FastAPI
# declares dependencies — `x: T = Depends(...)`. Idiomatic here, not a bug.
"app/*.py" = ["B008"]
"app/**/*.py" = ["B008"]
# S101 is `assert`, which is what a test is made of. Only S101 is waived —
# the rest of the security ruleset still applies to test code, which handles
# the same secrets the app does.
"tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Alembic's generated migration scripts follow its own boilerplate, and
# aren't hand-typed — same reasoning as the ruff exclude above.
exclude = ["migrations/versions"]
