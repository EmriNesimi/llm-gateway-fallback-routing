[tool.pytest.ini_options]
# Put the project root on sys.path so `pytest` (not just `python -m pytest`)
# can import the `app` package. Without this the test suite fails to collect.
pythonpath = ["."]
testpaths = ["tests"]
# strict-markers turns a typo'd @pytest.mark.asyncio into an error rather than
# a silently-ignored decorator — which for async tests means the body never
# runs and the test passes without asserting anything.
# strict-config does the same for a mistyped setting in this file.
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-generated migration files follow Alembic's own boilerplate style,
# not ours — don't hand-tune them just to satisfy the linter every time.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# B (flake8-bugbear) catches the likely-a-bug shapes the others don't — it's
# how the over-broad `pytest.raises(Exception)` assertions were found, which
# would have passed on any error at all including a typo.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults, which is exactly how FastAPI
# declares dependencies — `x: T = Depends(...)`. Idiomatic here, not a bug.
"app/*.py" = ["B008"]
"app/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Alembic's generated migration scripts follow its own boilerplate, and
# aren't hand-typed — same reasoning as the ruff exclude above.
exclude = ["migrations/versions"]
