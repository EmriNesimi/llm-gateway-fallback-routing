groups:
  - name: llm-gateway
    rules:
      # Decision 010 asks for exactly this pair. Breakers are per-process, so
      # the two questions are genuinely different: is a provider down, or is
      # one replica sick? Aggregating hides the second; alerting per instance
      # would page on the first N times over.
      - alert: ProviderCircuitOpen
        expr: max by (provider) (gateway_circuit_state) >= 2
        for: 2m
        labels: {severity: warning}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#providercircuitopen"
          summary: "{{ $labels.provider }} circuit is open"
          description: >-
            Every replica reporting open means the provider itself is failing;
            requests are falling through to the next in the chain.

      - alert: ProviderCircuitDisagreement
        expr: >-
          max by (provider) (gateway_circuit_state)
            - min by (provider) (gateway_circuit_state) > 0
        for: 5m
        labels: {severity: info}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#providercircuitdisagreement"
          summary: "replicas disagree about {{ $labels.provider }}"
          description: >-
            One instance sees this provider as failing and another doesn't —
            the signature of a replica-local fault (wedged pool, bad cached
            DNS, stale credential) rather than a provider outage. A shared
            breaker would have hidden this by design.

      # Every other rule in this file is evaluated over metrics the gateway
      # itself publishes. If the gateway is down there are no metrics, so none
      # of them fire — they just go absent, which looks identical to "nothing
      # is wrong". `up` is synthesised by Prometheus from the scrape itself,
      # so it is the one signal that still exists when the subject doesn't.
      - alert: GatewayTargetDown
        expr: up{job="llm-gateway"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#gatewaytargetdown"
          summary: "the gateway is not being scraped"
          description: >-
            Prometheus cannot reach {{ $labels.instance }}. Either the gateway
            is down, or METRICS_TOKEN was set without adding the matching
            credentials to the scrape config — /metrics then returns 401 and
            the target reads as down with nothing pointing at the token.

      # status="error" is not "a request 4xx'd" — it is specifically
      # AllProvidersFailedError, meaning every provider in the chain was tried
      # and none served the request. Fallback exists to absorb single-provider
      # failure, so a sustained share of requests getting through the whole
      # chain and still failing means the absorbing has stopped working.
      # 10% is deliberately low for that reason.
      #
      # Budget exhaustion also lands here: an exhausted provider is dropped
      # from the chain, and a chain with nothing left in it fails this way. If
      # this fires alongside ProviderBudgetExhausted, that is the cause.
      - alert: GatewayRequestsFailingAcrossWholeChain
        expr: >-
          sum(rate(gateway_requests_total{status="error"}[5m]))
            / sum(rate(gateway_requests_total[5m])) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#gatewayrequestsfailingacrosswholechain"
          summary: "over 10% of requests are failing every provider"
          description: >-
            No division-by-zero guard is needed: with no traffic both rates are
            0, and 0/0 is NaN, which fails the comparison rather than firing.

      # Not covered by the budget alerts below: this is not a money problem.
      # A chain reaching a model with no pricing entry means the gateway
      # cannot bound what a request would cost, so it refuses rather than run
      # it un-metered (decision 012). Waiting does not fix it and no balance
      # is running out — someone has to add the entry.
      #
      # Any occurrence at all is worth waking up for, hence a threshold of
      # zero rather than a rate: the build guard that makes this unreachable
      # has already failed if this fires.
      - alert: GatewayRefusingUnpricedRequests
        expr: increase(gateway_requests_refused_total{reason="no_pricing_configured"}[10m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#gatewayrefusingunpricedrequests"
          summary: "requests refused because a model has no price"
          description: >-
            A routable model is missing from app/budget/pricing.py, so its cost
            cannot be bounded and the chain has nothing usable left. Retrying
            will not help.

      # The failure the breaker cannot see. A provider that errors outright
      # trips the circuit; one that is merely degraded — timing out and
      # succeeding on retry, or failing just under the threshold — never does.
      # Fallback absorbs it silently, so the only symptom is that the primary
      # has quietly stopped serving and every request costs an extra hop of
      # latency and a second provider call.
      - alert: ProviderFallbackRateHigh
        expr: >-
          sum(rate(gateway_fallback_triggered_total[10m]))
            / sum(rate(gateway_requests_total[10m])) > 0.25
        for: 15m
        labels: {severity: warning}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#providerfallbackratehigh"
          summary: "over a quarter of requests are being served by a fallback"
          description: >-
            The primary provider in some chain is degraded rather than down.
            Requests still succeed, so nothing else fires — but each one pays
            for a failed attempt first.

      # End-to-end, so it includes every retry and every fallback hop — which
      # is the point. A request that eventually succeeds after two timeouts
      # and a fallback is a success to every other rule here and a
      # thirty-second wait to the caller.
      #
      # 20s against a 30s per-provider timeout: high enough that ordinary
      # generation never reaches it, low enough to fire before requests start
      # timing out outright.
      #
      # This threshold was 10s and could never be exceeded meaningfully: the
      # histogram's largest finite bucket was also 10s, so the quantile could
      # only clear it by landing in +Inf. Now that the buckets reach 90s, the
      # number means what it says.
      - alert: RequestLatencyDegraded
        expr: >-
          histogram_quantile(
            0.95, sum(rate(gateway_request_latency_seconds_bucket[10m])) by (le)
          ) > 20
        for: 10m
        labels: {severity: warning}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#requestlatencydegraded"
          summary: "p95 request latency is over 20s"
          description: >-
            Requests are succeeding but slowly. Usually a provider degrading
            rather than failing, so the breaker stays closed and nothing else
            fires.

      # Any unhandled exception is a bug, so the threshold is "more than
      # none" rather than a rate. These are the failures that reach no other
      # rule: they raise before or around a handler, so the request counter
      # never moves and the graphs just go flat.
      - alert: UnhandledExceptions
        expr: increase(gateway_unhandled_exceptions_total[10m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#unhandledexceptions"
          summary: "requests are failing with unhandled exceptions"
          description: >-
            Something is raising past every handler. Most often a dependency
            outage that was not caught closer to its source — Redis or the
            database — rather than a bug in request handling.

      # The gauge added for exactly this. gateway_cost_usd_total only ever
      # says what has gone; without a headroom alert the first warning is a
      # 402 after the balance is spent.
      - alert: ProviderBudgetLow
        expr: gateway_provider_budget_remaining_usd < 1
        for: 1m
        labels: {severity: warning}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#providerbudgetlow"
          summary: "{{ $labels.provider }} has under $1 of budget left"

      - alert: ProviderBudgetExhausted
        expr: gateway_provider_budget_remaining_usd <= 0
        for: 1m
        labels: {severity: critical}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#providerbudgetexhausted"
          summary: "{{ $labels.provider }} is out of budget and is being skipped"

      # Any leak at all is worth knowing about. It fails in the safe direction
      # — the ceiling gets smaller, never larger — which is precisely why
      # nobody would spot it: spend looks normal and headroom quietly erodes.
      # No `for:` clause, because this is a discrete event rather than a
      # condition that persists long enough to be sampled twice.
      - alert: BudgetReservationLeaked
        expr: increase(gateway_budget_reservation_leaked_usd_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          runbook_url: "https://github.com/EmriNesimi/llm-gateway-fallback-routing/blob/main/docs/runbook.md#budgetreservationleaked"
          summary: "{{ $labels.ledger }} ledger lost a reservation it could not refund"
