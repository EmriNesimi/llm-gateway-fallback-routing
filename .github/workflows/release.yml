name: Release

# The README has carried a release badge for a while, pointing at tags nobody
# could pull anything from. This closes that loop: a tag produces an image, so
# running the gateway no longer requires cloning it and building locally.
on:
  push:
    tags:
      - "v*"
  # Lets a release be re-cut without moving the tag, e.g. after fixing the
  # workflow itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true

jobs:
  image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GHCR with the built-in GITHUB_TOKEN, which is
      # read-only by default.
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # arm64 is emulated here, which is slow, but it only runs on a tag push
      # and it means an Apple Silicon machine can `docker run` this without
      # emulating on every start instead.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The action lower-cases this. GHCR rejects uppercase repository
          # names, and this owner's login has capitals in it.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
