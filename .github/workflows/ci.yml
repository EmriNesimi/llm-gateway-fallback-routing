name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. Without this the token inherits the repository default,
# which is often read+write — far more than a job that only checks out code
# and runs tests has any use for.
permissions:
  contents: read

# One run per branch. Pushing twice in quick succession — which this repo does
# constantly, given how granular the commits are — otherwise leaves the first
# run grinding through code that's already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Ceiling, not a target — this job runs in about 90 seconds. Without one,
    # GitHub's default lets a wedged step (a hung container pull, a test
    # waiting on a service that never comes up) burn six hours of runner
    # time before anyone finds out.
    timeout-minutes: 15

    # Real Redis, not just fakeredis — the rate limiter's Lua script has
    # previously behaved subtly differently under fakeredis's Lua emulation.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      # The floor sits one point under the current 94% rather than exactly at
      # it: at-current fails on rounding after any harmless refactor, while no
      # floor at all — the previous state — means coverage can only be
      # discovered to have dropped, never prevented from dropping.
      # alerts.yml is committed but nothing validated it. A malformed rule
      # doesn't degrade gracefully — Prometheus refuses to load the file, so
      # every alert in it silently stops existing.
      - name: Validate Prometheus rules and config
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      # The compose file has grown to six services with health gates, port
      # bindings and variable substitution. A typo in it breaks the entire
      # stack and is currently only discovered by someone running `make up`.
      - name: Validate docker-compose
        # .env is gitignored, and the gateway service declares it under
        # env_file, so compose refuses to parse without one. Copying the
        # example in is what a new user does anyway — which makes this step
        # also check that .env.example is a working starting point, not just
        # that the compose file parses.
        run: |
          cp .env.example .env
          docker compose config --quiet

      # The two shell scripts here are load-bearing and unlinted: the
      # entrypoint decides whether migrations run before the app starts, and
      # demo.sh is what a reader runs first. Shell fails quietly — an unquoted
      # expansion or a typo'd variable becomes an empty string rather than an
      # error — so the failure mode is a container that starts having skipped
      # its migrations, not one that refuses to start.
      #
      # Discovered from git rather than listed, so a new script is covered the
      # day it lands instead of whenever someone remembers this step exists.
      - name: Lint shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'linting: %s\n' "${scripts[@]}"
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:stable "${scripts[@]}"

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=93

  postgres-migrations:
    runs-on: ubuntu-latest
    # Ceiling, not a target — this job runs in about 50 seconds. Without one,
    # GitHub's default lets a wedged step (a hung container pull, a test
    # waiting on a service that never comes up) burn six hours of runner
    # time before anyone finds out.
    timeout-minutes: 10

    # The test suite above runs entirely against an in-memory SQLite DB (see
    # tests/conftest.py's isolated_db fixture), so it never actually proves
    # the Postgres path works. This job closes that gap: it runs the real
    # Alembic migrations against a real Postgres instance, the same way
    # docker-entrypoint.sh does for a production deployment.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://gateway:changeme@localhost:5432/gateway

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to Postgres
        run: alembic upgrade head

      - name: Verify migrations match current models
        run: alembic check

  # The Dockerfile was previously only exercised by release.yml, on tag — so
  # breaking it stayed invisible until someone cut a release and the build
  # failed with the tag already pushed. Single-arch and no push: this is
  # asking "does it still build and start", not producing an artifact.
  image:
    runs-on: ubuntu-latest
    # Ceiling, not a target — this job runs in about 40 seconds. Without one,
    # GitHub's default lets a wedged step (a hung container pull, a test
    # waiting on a service that never comes up) burn six hours of runner
    # time before anyone finds out.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t llm-gateway:ci .

      - name: It starts, serves, and is not root
        run: |
          docker run -d --name ci-smoke -p 8000:8000 \
            -e GATEWAY_ENV_FILE="" -e GATEWAY_API_KEYS=ci-smoke-key \
            llm-gateway:ci
          for i in $(seq 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          curl -sf http://localhost:8000/healthz
          test "$(docker exec ci-smoke id -u)" != "0"
          docker rm -f ci-smoke
