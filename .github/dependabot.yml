version: 2
updates:
  # pip-audit already fails the build on a known CVE, but only tells you after
  # one is published against something you're already running. This opens the
  # PR before that.
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps rather than five. Security updates are
      # deliberately left ungrouped so they arrive on their own and can be
      # merged without reading five unrelated diffs.
      python-minor-and-patch:
        update-types: [minor, patch]

  # The actions are pinned by major tag (@v4, @v5), so these only move when a
  # new major lands — rare, and exactly when a human should look.
  #
  # Grouped anyway. "Rare" turned out to mean four PRs in one morning the
  # first time Dependabot ran, and a major bump of setup-python is not usefully
  # reviewed in isolation from a major bump of checkout — they run in the same
  # job and fail together.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      workflow-actions:
        patterns: ["*"]

  # Covers the Dockerfile's base image and every image in
  # docker-compose.yml. Pinning those to exact versions was the right call for
  # reproducibility, but it also turned five floating tags into five things
  # Dependabot can propose — and this repo has already had one ten-PR morning.
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      # One PR for the whole stack. These images are upgraded together in
      # practice anyway: the point of pinning them was that the stack is a
      # known combination, and reviewing them one at a time does not test
      # that combination.
      container-images:
        patterns: ["*"]
