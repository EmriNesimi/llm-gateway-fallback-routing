# Every port below binds to 127.0.0.1 rather than publishing on all
# interfaces. They were on 0.0.0.0, which on any shared network — a café, an
# office, a flatmate's laptop — put Redis, Postgres, Grafana and the gateway
# itself in reach of anyone on the same subnet. Redis mattered most: it holds
# the rate-limit and spend counters, so an unauthenticated peer could DEL them
# and remove both controls on what this gateway is allowed to spend.
services:
  redis:
    image: redis:7-alpine
    # A password as well as the loopback bind. Two independent controls: the
    # bind protects against the network, the password against anything that
    # gets past it — a container on the same bridge, a port-forward, or a
    # future compose edit that republishes this by accident.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-localdevpassword}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdevpassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: the gateway defaults to a local SQLite file, so Postgres is not
  # required to run the stack. Point DATABASE_URL in .env at this service
  # (postgresql+asyncpg://gateway:changeme@postgres:5432/gateway) to use it
  # for the admin API / audit log instead.
  postgres:
    image: postgres:16-alpine
    ports:
      # 5433 on the host, not 5432. Anyone running a second Postgres container
      # — a different project, Postgres.app, a system install — already holds
      # the default, and the collision stops this whole stack from starting.
      # Only the host mapping moves: DATABASE_URL reaches this over the
      # compose network as postgres:5432, which is unchanged.
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=gateway
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=gateway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Traces have been fully instrumented for a while — every provider attempt
  # gets a span with provider, model, attempt and request_id — but nothing in
  # this stack listened for them, so the documented setup was "point
  # OTEL_EXPORTER_OTLP_ENDPOINT at any collector" and go assemble one.
  # all-in-one is collector plus UI in a single container, the right tradeoff
  # for a dev stack: it keeps traces in memory and loses them on restart,
  # which is fine here and not something to deploy.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "127.0.0.1:16686:16686"  # web UI
      - "127.0.0.1:4317:4317"    # OTLP/gRPC, what app/observability/tracing.py exports to
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever .env says, because .env is written for running the
      # gateway on the host, where a collector would be on localhost. Inside
      # the container localhost is the container itself, so a host-shaped
      # value here means traces silently go nowhere. compose's `environment`
      # wins over `env_file`, so the stack works without editing .env.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # Must carry the password set on the redis service above; the
      # default in .env has no credentials and would fail to connect.
      - REDIS_URL=redis://:${REDIS_PASSWORD:-localdevpassword}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      # postgres is already started unconditionally by `docker compose up`
      # (no profiles gate it), so this costs nothing even when DATABASE_URL
      # points at SQLite — but without it, a DATABASE_URL pointed at the
      # bundled postgres service (as documented above) could race
      # docker-entrypoint.sh's `alembic upgrade head` against postgres still
      # starting up, crashing the gateway container on a cold `up`.
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
